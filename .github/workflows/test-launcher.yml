# Runs the launcher the way a user would, on Apple Silicon, from the public
# nightly release. Never signs in or downloads the game (CI logs are public).
name: Test launcher (macOS)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release nightly"]
    types: [completed]
  push:
    paths:
      - mcb
      - scripts/mcbgame.py
      - third_party/components.json
      - scripts/winegdk-env.sh
      - .github/workflows/test-launcher.yml

jobs:
  launcher:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: ./mcb help
      - run: ./mcb setup < /dev/null
      - run: ./mcb doctor
      - run: ./mcb selftest
      - name: Prepare a placeholder game folder (no game files in CI)
        run: |
          set -euo pipefail
          games="$HOME/Library/Application Support/MCBedrockForMac/games/release"
          mkdir -p "$games"
          echo placeholder > "$games/XCurl.dll"
          ./mcb prepare | tee prepare.log
          grep -q "forced onto the XCurl provider" prepare.log
          for f in XCurl.dll.mcb-orig xcurl_real.dll libHttpClient.GDK.dll cacert.pem etc/ssl/certs/ca-bundle.crt; do
            test -e "$games/$f" || { echo "missing $f"; exit 1; }
          done
          ./mcb wine reg query 'HKLM\Software\Microsoft\Windows NT\CurrentVersion\OEM' /v ConsoleMode | tee reg.txt
          grep -q 0x8 reg.txt
          rm -rf "$games"

      - name: Refuses to play without the game
        run: |
          if ./mcb play 2>err.txt; then echo "play should have failed"; exit 1; fi
          grep -q "is not installed" err.txt && cat err.txt
